<!DOCTYPE html>
<html>
<head>
    <title>ELI 管理平台 - Google 登入測試</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" onload="initClient()" async defer></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; background: #f0f0f0; width: 80%; word-break: break-all; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4285F4; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>ELI 管理平台</h2>
    <p>測試 Google 帳號登入與 Drive 權限</p>
    
    <button onclick="handleAuthClick()">使用 Google 帳號登入</button>

    <div id="status">等待登入...</div>

    <script>
        let tokenClient;
        let accessToken = null;

        // 1. 初始化 Google 客戶端
        function initClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: '1018971008023-u5tooicug7ij968fiibn7fk7tf0ubc58.apps.googleusercontent.com', // <-- 填入你的 Client ID
                scope: 'https://www.googleapis.com/auth/drive.appdata', // 我們剛設定的權限
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('status').innerHTML = 
                            '<b>登入成功！</b><br>你的 Access Token 是：<br>' + accessToken;
                        console.log("Token:", accessToken);
                        // 這裡拿到 Token 後，就可以開始呼叫 Google Drive API 讀寫資料了
                    }
                },
            });
        }

        // 2. 點擊按鈕觸發登入
        function handleAuthClick() {
            // 請求 Token
            tokenClient.requestAccessToken();
        }
    </script>
</body>
</html>
