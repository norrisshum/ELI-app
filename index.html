<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELI 管理平台</title>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#0f172a; color:#e2e8f0; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px; }
    .card { background:#111827; border:1px solid #334155; border-radius:16px; padding:16px; margin-bottom:16px; }
    button {
      background:#2563eb; color:white; border:none; padding:10px 14px; border-radius:10px;
      cursor:pointer; margin-right:8px; margin-bottom:8px;
    }
    button.secondary { background:#334155; }
    button.danger { background:#dc2626; }
    input, select, textarea {
      width:100%; box-sizing:border-box; padding:10px 12px; border-radius:10px;
      border:1px solid #334155; background:#0b1220; color:#e2e8f0; margin-top:6px;
    }
    label { display:block; margin-top:12px; font-size:14px; color:#cbd5e1; }
    table { width:100%; border-collapse: collapse; margin-top:12px; }
    th, td { border-bottom:1px solid #334155; padding:10px 8px; text-align:left; vertical-align: top; font-size:14px; }
    th { color:#93c5fd; }
    .row { display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
    @media (max-width: 700px){ .row { grid-template-columns: 1fr; } }
    .muted { color:#94a3b8; font-size:13px; }
    .ok { color:#4ade80; }
    .warn { color:#fbbf24; }
    .bad { color:#f87171; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ELI 管理平台</h1>
    <p class="muted">Google Drive 作個人資料庫版本</p>

    <div class="card">
      <div>
        <button id="btnAuth" onclick="handleAuthClick()">Google 登入</button>
        <button id="btnSignout" class="secondary" onclick="handleSignoutClick()" style="display:none;">登出</button>
        <button id="btnLoad" class="secondary" onclick="loadEliData()" style="display:none;">讀取 ELI 資料</button>
        <button id="btnSave" class="secondary" onclick="saveCurrentData()" style="display:none;">儲存到 Google Drive</button>
      </div>
      <p id="status" class="muted">未登入</p>
      <p id="fileInfo" class="muted"></p>
    </div>

    <div class="card">
      <h2>新增 / 編輯 ELI</h2>

      <div class="row">
        <div>
          <label>產品編號</label>
          <input id="id" placeholder="ELI-HK-24018">
        </div>
        <div>
          <label>市場</label>
          <select id="market">
            <option>HK</option>
            <option>US</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>相關股票</label>
          <input id="underlying" placeholder="700 HK / AAPL US">
        </div>
        <div>
          <label>貨幣</label>
          <select id="currency">
            <option>HKD</option><option>USD</option><option>CNY</option><option>EUR</option>
            <option>GBP</option><option>AUD</option><option>NZD</option><option>CAD</option><option>JPY</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>KO 類型</label>
          <select id="ko_type">
            <option value="daily">Daily</option>
            <option value="daily_memory">Daily Memory</option>
            <option value="period_end">Period End</option>
          </select>
        </div>
        <div>
          <label>KI 類型</label>
          <select id="ki_type">
            <option value="EKI">EKI</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>行使價</label>
          <input id="strike" type="number" step="0.01" placeholder="388">
        </div>
        <div>
          <label>KO 水平</label>
          <input id="ko_level" type="number" step="0.01" placeholder="405">
        </div>
      </div>

      <div class="row">
        <div>
          <label>KI 水平</label>
          <input id="ki_level" type="number" step="0.01" placeholder="320">
        </div>
        <div>
          <label>最新收市價</label>
          <input id="latest_close" type="number" step="0.01" placeholder="406.2">
        </div>
      </div>

      <div class="row">
        <div>
          <label>觀察日</label>
          <input id="observation_date" type="date">
        </div>
        <div>
          <label>到期日</label>
          <input id="maturity_date" type="date">
        </div>
      </div>

      <div class="row">
        <div>
          <label>RM 本身</label>
          <input id="rm_owner" placeholder="RM Chan">
        </div>
        <div>
          <label>客戶姓名 / 代號</label>
          <input id="client_name" placeholder="張客戶 / C001">
        </div>
      </div>

      <label>備註</label>
      <textarea id="notes" rows="3" placeholder="例如：接近 KO，需跟進"></textarea>

      <div style="margin-top:14px;">
        <button onclick="addProduct()">加入到本地列表</button>
        <button class="secondary" onclick="clearForm()">清空表單</button>
      </div>
    </div>

    <div class="card">
      <h2>產品列表</h2>
      <p class="muted">會自動計算 KO / KI 狀態</p>
      <div id="summary" class="muted"></div>
      <div id="tableWrap"></div>
    </div>

    <div class="card">
      <h2>Debug</h2>
      <pre id="debug"></pre>
    </div>
  </div>

  <script>
    const CLIENT_ID = "YOUR_CLIENT_ID_HERE.apps.googleusercontent.com";
    const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
    const SCOPES = "https://www.googleapis.com/auth/drive.file";

    const ELI_FILENAME = "eli.json";
    let tokenClient;
    let gapiInited = false;
    let gisInited = false;
    let eliFileId = null;
    let products = [];

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setDebug(obj) {
      document.getElementById("debug").textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }

    function gapiLoaded() {
      gapi.load("client", initializeGapiClient);
    }

    async function initializeGapiClient() {
      await gapi.client.init({
        discoveryDocs: [DISCOVERY_DOC]
      });
      gapiInited = true;
      maybeEnableButtons();
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: 1018971008023-u5tooicug7ij968fiibn7fk7tf0ubc58.apps.googleusercontent.com,
        scope: SCOPES,
        callback: ""
      });
      gisInited = true;
      maybeEnableButtons();
    }

    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        document.getElementById("btnAuth").disabled = false;
      }
    }

    function handleAuthClick() {
      tokenClient.callback = async (resp) => {
        if (resp.error) {
          setStatus("登入失敗");
          setDebug(resp);
          return;
        }
        document.getElementById("btnSignout").style.display = "inline-block";
        document.getElementById("btnLoad").style.display = "inline-block";
        document.getElementById("btnSave").style.display = "inline-block";
        setStatus("已登入，開始搜尋 / 載入 Google Drive 檔案...");
        await findOrCreateFile();
      };

      const token = gapi.client.getToken();
      if (token === null) {
        tokenClient.requestAccessToken({ prompt: "consent" });
      } else {
        tokenClient.requestAccessToken({ prompt: "" });
      }
    }

    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken("");
      }
      eliFileId = null;
      products = [];
      renderProducts();
      document.getElementById("btnSignout").style.display = "none";
      document.getElementById("btnLoad").style.display = "none";
      document.getElementById("btnSave").style.display = "none";
      setStatus("已登出");
      document.getElementById("fileInfo").textContent = "";
      setDebug("");
    }

    async function findOrCreateFile() {
      try {
        const res = await gapi.client.drive.files.list({
          q: `name='${ELI_FILENAME}' and trashed=false`,
          fields: "files(id,name,mimeType,modifiedTime)"
        });

        const files = res.result.files || [];
        if (files.length > 0) {
          eliFileId = files[0].id;
          document.getElementById("fileInfo").textContent = `已找到檔案：${files[0].name} (${eliFileId})`;
          setStatus("已找到 eli.json，可以讀取");
          await loadEliData();
        } else {
          const file = await gapi.client.drive.files.create({
            resource: {
              name: ELI_FILENAME,
              mimeType: "application/json"
            },
            media: {
              mimeType: "application/json",
              body: JSON.stringify({ products: [] }, null, 2)
            },
            fields: "id,name"
          });
          eliFileId = file.result.id;
          document.getElementById("fileInfo").textContent = `已建立新檔案：${file.result.name} (${eliFileId})`;
          products = [];
          renderProducts();
          setStatus("已建立新 eli.json");
        }
      } catch (e) {
        setStatus("找不到或建立檔案失敗");
        setDebug(e);
      }
    }

    async function loadEliData() {
      if (!eliFileId) {
        setStatus("未有 ELI 檔案 ID");
        return;
      }
      try {
        const res = await gapi.client.drive.files.get({
          fileId: eliFileId,
          alt: "media"
        });

        const text = res.body || "{}";
        const data = JSON.parse(text);
        products = Array.isArray(data.products) ? data.products : [];
        renderProducts();
        setStatus(`已載入 ${products.length} 筆產品`);
        setDebug(data);
      } catch (e) {
        setStatus("讀檔失敗");
        setDebug(e);
      }
    }

    async function saveEliData() {
      if (!eliFileId) {
        setStatus("未有檔案 ID，先登入並建立 / 選擇檔案");
        return;
      }
      try {
        const content = JSON.stringify({ products }, null, 2);
        await gapi.client.drive.files.update({
          fileId: eliFileId,
          media: {
            mimeType: "application/json",
            body: content
          }
        });
        setStatus(`已儲存 ${products.length} 筆產品到 Google Drive`);
        setDebug({ saved: true, count: products.length, fileId: eliFileId });
      } catch (e) {
        setStatus("寫檔失敗");
        setDebug(e);
      }
    }

    function addProduct() {
      const p = {
        id: document.getElementById("id").value.trim(),
        market: document.getElementById("market").value,
        underlying: document.getElementById("underlying").value.trim(),
        currency: document.getElementById("currency").value,
        ko_type: document.getElementById("ko_type").value,
        ki_type: document.getElementById("ki_type").value,
        strike: num("strike"),
        ko_level: num("ko_level"),
        ki_level: num("ki_level"),
        latest_close: num("latest_close"),
        observation_date: document.getElementById("observation_date").value,
        maturity_date: document.getElementById("maturity_date").value,
        rm_owner: document.getElementById("rm_owner").value.trim(),
        client_name: document.getElementById("client_name").value.trim(),
        notes: document.getElementById("notes").value.trim()
      };

      if (!p.id || !p.underlying) {
        alert("請至少輸入產品編號同相關股票");
        return;
      }

      const idx = products.findIndex(x => x.id === p.id);
      if (idx >= 0) products[idx] = p;
      else products.unshift(p);

      renderProducts();
      setStatus(`已加入 / 更新產品：${p.id}`);
    }

    function num(id) {
      const v = parseFloat(document.getElementById(id).value);
      return Number.isFinite(v) ? v : null;
    }

    function clearForm() {
      ["id","underlying","strike","ko_level","ki_level","latest_close","rm_owner","client_name","notes"].forEach(id => {
        document.getElementById(id).value = "";
      });
      document.getElementById("market").value = "HK";
      document.getElementById("currency").value = "HKD";
      document.getElementById("ko_type").value = "daily";
      document.getElementById("ki_type").value = "EKI";
      document.getElementById("observation_date").value = "";
      document.getElementById("maturity_date").value = "";
    }

    function calcStatus(p) {
      if (p.latest_close == null || p.ko_level == null || p.ki_level == null) return { label: "未知", cls: "muted" };
      const koPct = (p.latest_close / p.ko_level) * 100;
      const kiPct = (p.latest_close / p.ki_level) * 100;
      if (koPct >= 100) return { label: "可早贖回", cls: "ok" };
      if (koPct >= 97) return { label: "接近 KO", cls: "warn" };
      if (kiPct <= 105) return { label: "接近 KI", cls: "bad" };
      return { label: "正常", cls: "muted" };
    }

    function renderProducts() {
      const rows = products.map(p => {
        const st = calcStatus(p);
        return `
          <tr>
            <td>${escapeHtml(p.id || "")}</td>
            <td>${escapeHtml(p.underlying || "")}</td>
            <td>${escapeHtml(p.market || "")}</td>
            <td>${escapeHtml(p.currency || "")}</td>
            <td>${escapeHtml(p.ko_type || "")}</td>
            <td>${escapeHtml(p.ki_type || "")}</td>
            <td>${fmt(p.latest_close)}</td>
            <td>${fmt(p.ko_level)}</td>
            <td>${fmt(p.ki_level)}</td>
            <td class="${st.cls}">${st.label}</td>
          </tr>
        `;
      }).join("");

      document.getElementById("summary").textContent = `總數：${products.length}`;
      document.getElementById("tableWrap").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>產品編號</th>
              <th>相關股票</th>
              <th>市場</th>
              <th>貨幣</th>
              <th>KO 類型</th>
              <th>KI 類型</th>
              <th>收市價</th>
              <th>KO</th>
              <th>KI</th>
              <th>狀態</th>
            </tr>
          </thead>
          <tbody>${rows || "<tr><td colspan='10' class='muted'>未有資料</td></tr>"}</tbody>
        </table>
      `;
    }

    function fmt(v) {
      return (v === null || v === undefined || Number.isNaN(v)) ? "" : Number(v).toFixed(2);
    }

    function escapeHtml(s) {
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
    }

    window.addEventListener("load", () => {
      document.getElementById("btnAuth").disabled = true;
      renderProducts();
    });
  </script>
</body>
</html>
